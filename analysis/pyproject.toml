[project]
name = "plumb"
version = "0.1.0"
description = "Synthetic stroke harness and algorithm development for the Plumb putting analyzer"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
